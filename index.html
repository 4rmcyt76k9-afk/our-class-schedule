<style>
a;border-radius:12px;padding:10px 14px}
    .btn.primary{background:var(--primary);color:white;border-color:var(--primary)}
    .btn.small{padding:7px 10px;font-size:13px}
    .layout{display:grid;grid-template-columns:290px 1fr;gap:16px}
    .panel,.calendar-wrap{background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:0 4px 18px rgba(50,40,80,.05)}
    .panel{padding:16px}
    .panel h2{font-size:16px;margin:0 0 12px}
    .section{padding-bottom:15px;margin-bottom:15px;border-bottom:1px solid var(--line)}
    .section:last-child{border-bottom:0;margin-bottom:0}
    label{display:block;font-size:12px;color:var(--muted);margin:9px 0 5px}
    input,textarea,select{width:100%;border:1px solid #ddd8e5;border-radius:10px;padding:9px;background:#fff;color:var(--text)}
    textarea{resize:vertical;min-height:70px}
    .teacher-row{display:grid;grid-template-columns:1fr 44px 28px;gap:6px;align-items:center;margin-bottom:7px}
    .color{width:34px;height:30px;padding:2px;border:1px solid var(--line);border-radius:8px}
    .icon-btn{border:0;background:transparent;font-size:18px}
    .palette{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
    .swatch{width:24px;height:24px;border-radius:50%;border:2px solid white;box-shadow:0 0 0 1px #ddd}
    .legend{display:flex;gap:8px;flex-wrap:wrap}
    .legend span{display:inline-flex;align-items:center;gap:5px;font-size:12px}
    .dot{width:10px;height:10px;border-radius:50%;display:inline-block}
    .calendar-wrap{overflow:hidden}
    .calendar-head{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid var(--line)}
    .month-title{font-weight:700;font-size:19px}
    .nav{display:flex;gap:6px}
    .weekdays,.grid{display:grid;grid-template-columns:repeat(7,1fr)}
    .weekday{padding:9px;text-align:center;font-size:12px;color:var(--muted);border-bottom:1px solid var(--line)}
    .day{min-height:145px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:6px;background:#fff}
    .day:nth-child(7n){border-right:0}
    .day.other{background:#fbfafc;color:#b4aebb}
    .day.today{background:#fffdf0}
    .date-num{font-size:12px;font-weight:700;margin-bottom:5px}
    .week-role{font-size:10px;color:#777;margin:2px 0 5px;padding:3px 5px;background:#f6f3fb;border-radius:7px}
    .event{border-radius:8px;padding:5px 6px;margin:4px 0;font-size:11px;line-height:1.25;border-left:4px solid #bbb;position:relative}
    .event.done{opacity:.55;text-decoration:line-through}
    .event .time{font-weight:700}
    .event .teacher{font-size:10px;color:#625d68;margin-top:2px}
    .event-actions{display:flex;gap:4px;margin-top:3px}
    .event-actions button{font-size:10px;padding:2px 5px;border:0;border-radius:5px;background:rgba(255,255,255,.75)}
    .empty{color:#aaa;font-size:12px;padding:18px;text-align:center}
    .modal-bg{position:fixed;inset:0;background:rgba(35,30,45,.35);display:none;align-items:center;justify-content:center;padding:16px;z-index:20}
    .modal{background:white;border-radius:18px;width:min(620px,100%);max-height:90vh;overflow:auto;padding:20px}
    .modal h3{margin:0 0 15px}
    .form-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
    .full{grid-column:1/-1}
    .modal-footer{display:flex;justify-content:flex-end;gap:8px;margin-top:15px}
    .ocr-result{white-space:pre-wrap;background:#f7f5fa;border-radius:10px;padding:10px;font-size:12px;max-height:220px;overflow:auto}
    .status{font-size:12px;padding:7px 9px;border-radius:9px;background:#f3f1f7;color:#666}
    .status.ok{background:#eaf7ee;color:#398050}
    .status.bad{background:#fff0f1;color:#a34e5a}
    .week-role-wrap{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}
    .week-role-wrap div{font-size:9px;text-align:center}
    @media(max-width:900px){
      .layout{grid-template-columns:1fr}
      .panel{order:2}
      .calendar-wrap{order:1}
      .day{min-height:125px}
    }
    @media(max-width:650px){
      .app{padding:10px}
      header{align-items:flex-start;flex-direction:column}
      .day{min-height:110px;padding:4px}
      .event{font-size:10px}
      .weekday{padding:6px 2px}
    }
  </style>
</head>
<body>
<div class="app">
  <header>
    <div>
      <h1>우리반 같이 일정</h1>
      <div class="sub">담임교사들이 함께 보는 공유 업무 달력</div>
    </div>
    <div class="actions">
      <button class="btn" onclick="openSettings()">⚙ 설정</button>
      <button class="btn" onclick="openOcr()">🖼️ 이미지 일정 불러오기</button>
      <button class="btn primary" onclick="openEvent()">＋ 일정 등록</button>
    </div>
  </header>

  <div class="layout">
    <aside class="panel">
      <div class="section">
        <h2>반 / 저장 상태</h2>
        <div id="roomStatus" class="status">설정이 필요합니다.</div>
      </div>

      <div class="section">
        <h2>교사</h2>
        <div id="teacherList"></div>
        <button class="btn small" onclick="addTeacher()">＋ 교사 추가</button>
      </div>

      <div class="section">
        <h2>주간 담당 순환</h2>
        <div class="sub">처음 등록한 순서를 기준으로 주교사 → 부2 → 부1 사이클이 반복됩니다.</div>
        <div id="cycleSummary" style="margin-top:8px;font-size:13px"></div>
        <button class="btn small" style="margin-top:8px" onclick="saveTeachers()">순환 순서 저장</button>
      </div>

      <div class="section">
        <h2>교사 색상</h2>
        <div id="legend" class="legend"></div>
      </div>
    </aside>

    <main class="calendar-wrap">
      <div class="calendar-head">
        <div class="nav">
          <button class="btn small" onclick="changeMonth(-1)">‹</button>
          <button class="btn small" onclick="goToday()">오늘</button>
          <button class="btn small" onclick="changeMonth(1)">›</button>
        </div>
        <div id="monthTitle" class="month-title"></div>
        <div class="status" id="syncStatus">연결 준비 중</div>
      </div>
      <div class="weekdays">
        <div class="weekday">일</div><div class="weekday">월</div><div class="weekday">화</div>
        <div class="weekday">수</div><div class="weekday">목</div><div class="weekday">금</div><div class="weekday">토</div>
      </div>
      <div id="calendarGrid" class="grid"></div>
    </main>
  </div>
</div>

<div id="eventModal" class="modal-bg">
  <div class="modal">
    <h3 id="eventModalTitle">일정 등록</h3>
    <div class="form-grid">
      <div><label>날짜</label><input type="date" id="eventDate"></div>
      <div><label>시간</label><input type="time" id="eventTime"></div>
      <div class="full"><label>업무명</label><input id="eventTitle" placeholder="예: 부모상담 준비"></div>
      <div><label>담당 교사</label>
        <select id="eventTeacher"></select>
      </div>
      <div><label>반</label><input id="eventRoom" readonly></div>
      <div class="full"><label>메모</label><textarea id="eventMemo" placeholder="필요한 내용을 적어주세요."></textarea></div>
    </div>
    <div class="modal-footer">
      <button class="btn" onclick="closeModal('eventModal')">취소</button>
      <button class="btn primary" onclick="saveEvent()">저장</button>
    </div>
  </div>
</div>

<div id="settingsModal" class="modal-bg">
  <div class="modal">
    <h3>처음 설정</h3>
    <label>반 이름</label>
    <input id="roomName" placeholder="예: 꽃빛반">
    <label>주기 시작 날짜</label>
    <input type="date" id="cycleStart">
    <div class="sub" style="margin-top:8px">이 날짜가 포함된 주를 1주차로 계산합니다.</div>
    <div class="modal-footer">
      <button class="btn" onclick="closeModal('settingsModal')">취소</button>
      <button class="btn primary" onclick="saveRoom()">저장</button>
    </div>
  </div>
</div>

<div id="ocrModal" class="modal-bg">
  <div class="modal">
    <h3>월간 일정 이미지 불러오기</h3>
    <div class="sub">휴대폰 사진 또는 이미지 파일을 선택하면 OCR로 글자를 읽습니다. 인식된 일정은 확인 후 우리 반 일정으로 등록합니다.</div>
    <input type="file" id="imageInput" accept="image/*" style="margin-top:12px">
    <div id="ocrProgress" class="status" style="margin-top:10px">이미지를 선택해주세요.</div>
    <div id="ocrText" class="ocr-result" style="margin-top:10px;display:none"></div>
    <div id="ocrEntries" style="margin-top:10px"></div>
    <div class="modal-footer">
      <button class="btn" onclick="closeModal('ocrModal')">닫기</button>
    </div>
  </div>
</div>

<script>
/* =========================================================
   1) Supabase 연결
   ---------------------------------------------------------
   아래 두 값만 본인의 Supabase Connect 화면에서 넣습니다.
   Publishable key 또는 anon key를 사용합니다.
   Secret/service_role key는 절대 넣지 마세요.
   ========================================================= */
const SUPABASE_URL = "여기에_SUPABASE_URL";
const SUPABASE_KEY = "여기에_PUBLISHABLE_KEY";

let sb = null;
if (SUPABASE_URL.startsWith("http") && !SUPABASE_URL.includes("여기에_") &&
    SUPABASE_KEY && !SUPABASE_KEY.includes("여기에_")) {
  sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
}

const state = {
  room: null,
  teachers: [],
  events: [],
  month: new Date(),
  editingId: null
};

const palette = [
  "#F6B7C8","#F7C9A9","#F8E29A","#BFE3C0","#B8DDE8",
  "#BFC9F1","#D5B8E8","#E5B8D0","#C8D8B5","#F1D0A6",
  "#C6B8E8","#AFCFE6"
];

const $ = id => document.getElementById(id);
const iso = d => d.toISOString().slice(0,10);

function setSync(text, cls=""){
  $("syncStatus").textContent=text;
  $("syncStatus").className="status "+cls;
}

function openModal(id){$(id).style.display="flex"}
function closeModal(id){$(id).style.display="none"}

function localFallback(){
  try{
    const raw=localStorage.getItem("classScheduleDemo");
    return raw ? JSON.parse(raw) : {room:null,teachers:[],events:[]};
  }catch(e){return {room:null,teachers:[],events:[]}}
}

function saveFallback(){
  localStorage.setItem("classScheduleDemo", JSON.stringify({
    room:state.room,teachers:state.teachers,events:state.events
  }));
}

async function loadData(){
  setSync("불러오는 중");
  if(!sb){
    const d=localFallback();
    state.room=d.room; state.teachers=d.teachers; state.events=d.events;
    setSync("로컬 미리보기","ok");
    renderAll(); return;
  }
  try{
    const {data:rooms,error:re}=await sb.from("rooms").select("*").order("created_at",{ascending:true}).limit(1);
    if(re) throw re;
    state.room=rooms?.[0]||null;
    if(state.room){
      const {data:ts,error:te}=await sb.from("teachers").select("*").eq("room_id",state.room.id).order("sort_order");
      if(te) throw te;
      state.teachers=ts||[];
      const {data:es,error:ee}=await sb.from("schedule_events").select("*").eq("room_id",state.room.id).order("event_date").order("start_time");
      if(ee) throw ee;
      state.events=es||[];
    }
    setSync("Supabase 연결됨","ok");
    renderAll();
  }catch(e){
    console.error(e);
    setSync("연결 오류","bad");
    alert("Supabase에서 데이터를 불러오지 못했습니다. 테이블 이름과 권한 설정을 확인해주세요.");
  }
}

function renderAll(){
  $("roomStatus").textContent=state.room ? `반: ${state.room.class_name}` : "반 이름을 먼저 설정해주세요.";
  renderTeachers(); renderLegend(); renderCycle(); renderCalendar();
}

function renderTeachers(){
  const box=$("teacherList"); box.innerHTML="";
  if(!state.teachers.length){
    box.innerHTML='<div class="empty">교사를 추가해주세요.</div>'; return;
  }
  state.teachers.forEach((t,i)=>{
    const row=document.createElement("div"); row.className="teacher-row";
    row.innerHTML=`
      <input value="${escapeHtml(t.name||"")}" onchange="editTeacher(${i},'name',this.value)" placeholder="교사 이름">
      <input class="color" type="color" value="${t.color||palette[i%palette.length]}" onchange="editTeacher(${i},'color',this.value)">
      <button class="icon-btn" title="삭제" onclick="removeTeacher(${i})">×</button>`;
    box.appendChild(row);
  });
}

function renderLegend(){
  const box=$("legend"); box.innerHTML="";
  state.teachers.forEach(t=>{
    const s=document.createElement("span");
    s.innerHTML=`<i class="dot" style="background:${t.color}"></i>${escapeHtml(t.name)}`;
    box.appendChild(s);
  });
  const c=document.createElement("span");
  c.innerHTML='<i class="dot" style="background:#ddd"></i>공동업무';
  box.appendChild(c);
}

function renderCycle(){
  if(!state.teachers.length){$("cycleSummary").textContent="교사 순서를 등록하면 주간 순환이 표시됩니다.";return}
  const names=state.teachers.map(t=>t.name||"미입력");
  if(names.length===1){$("cycleSummary").textContent=`주: ${names[0]} / 부1: 공동업무 / 부2: 공동업무`;return}
  if(names.length===2){
    $("cycleSummary").textContent=`${names[0]} → ${names[1]} → 반복 (2명 순환)`;
    return;
  }
  $("cycleSummary").innerHTML=`1주차: <b>${escapeHtml(names[0])}</b> / 부1 ${escapeHtml(names[2])} / 부2 ${escapeHtml(names[1])}<br>
  2주차: <b>${escapeHtml(names[1])}</b> / 부1 ${escapeHtml(names[0])} / 부2 ${escapeHtml(names[2])}<br>
  3주차: <b>${escapeHtml(names[2])}</b> / 부1 ${escapeHtml(names[1])} / 부2 ${escapeHtml(names[0])}`;
}

function weekIndex(dateStr){
  if(!state.room?.cycle_start) return 0;
  const start=new Date(state.room.cycle_start+"T00:00:00");
  const d=new Date(dateStr+"T00:00:00");
  const startSun=new Date(start);
  startSun.setDate(startSun.getDate()-startSun.getDay());
  const dSun=new Date(d);
  dSun.setDate(dSun.getDate()-dSun.getDay());
  return Math.floor((dSun-startSun)/(7*86400000));
}

function rolesForDate(dateStr){
  const n=state.teachers.length;
  if(n<3) return {main:state.teachers[0]?.name||"공동업무",sub1:n>1?state.teachers[1].name:"공동업무",sub2:"공동업무"};
  const k=((weekIndex(dateStr)%3)+3)%3;
  const main=state.teachers[k];
  const sub2=state.teachers[(k+2)%3];
  const sub1=state.teachers[(k+1)%3];
  return {main:main.name,sub1:sub1.name,sub2:sub2.name};
}

function renderCalendar(){
  const y=state.month.getFullYear(), m=state.month.getMonth();
  $("monthTitle").textContent=`${y}년 ${m+1}월`;
  const first=new Date(y,m,1), last=new Date(y,m+1,0);
  const start=new Date(y,m,1-first.getDay());
  const grid=$("calendarGrid"); grid.innerHTML="";
  for(let i=0;i<42;i++){
    const d=new Date(start); d.setDate(start.getDate()+i);
    const ds=iso(d);
    const cell=document.createElement("div");
    cell.className="day"+(d.getMonth()!==m?" other":"")+(ds===iso(new Date())?" today":"");
    const roles=rolesForDate(ds);
    let html=`<div class="date-num">${d.getDate()}</div>`;
    if(d.getDay()===0){
      html+=`<div class="week-role">주: ${escapeHtml(roles.main)} / 부1: ${escapeHtml(roles.sub1)} / 부2: ${escapeHtml(roles.sub2)}</div>`;
    }
    const evs=state.events.filter(e=>e.event_date===ds);
    evs.forEach(e=>{
      const teacher=state.teachers.find(t=>t.id===e.teacher_id);
      const color=teacher?.color||"#d8d8d8";
      html+=`<div class="event ${e.completed?'done':''}" style="border-left-color:${color};background:${hexToRgba(color,.28)}">
        <div><span class="time">${escapeHtml(e.start_time||"")}</span> ${escapeHtml(e.title||"")}</div>
        <div class="teacher">${escapeHtml(teacher?.name||"공동업무")}</div>
        <div class="event-actions">
          <button onclick="event.stopPropagation();toggleDone('${e.id}',${!e.completed})">${e.completed?'↩':'✓'}</button>
          <button onclick="event.stopPropagation();editEvent('${e.id}')">수정</button>
          <button onclick="event.stopPropagation();deleteEvent('${e.id}')">삭제</button>
        </div>
      </div>`;
    });
    cell.innerHTML=html;
    cell.onclick=()=>openEvent(ds);
    grid.appendChild(cell);
  }
}

function openEvent(date=iso(new Date())){
  state.editingId=null;
  $("eventModalTitle").textContent="일정 등록";
  $("eventDate").value=date;
  $("eventTime").value="09:00";
  $("eventTitle").value="";
  $("eventMemo").value="";
  $("eventRoom").value=state.room?.class_name||"반 미설정";
  fillTeacherSelect();
  $("eventTeacher").value="";
  openModal("eventModal");
}

function editEvent(id){
  const e=state.events.find(x=>x.id===id); if(!e)return;
  state.editingId=id;
  $("eventModalTitle").textContent="일정 수정";
  $("eventDate").value=e.event_date;
  $("eventTime").value=e.start_time||"";
  $("eventTitle").value=e.title||"";
  $("eventMemo").value=e.memo||"";
  $("eventRoom").value=state.room?.class_name||"";
  fillTeacherSelect(); $("eventTeacher").value=e.teacher_id||"";
  openModal("eventModal");
}

function fillTeacherSelect(){
  $("eventTeacher").innerHTML='<option value="">공동업무</option>'+state.teachers.map(t=>`<option value="${t.id}">${escapeHtml(t.name)}</option>`).join("");
}

async function saveEvent(){
  if(!state.room){alert("먼저 설정에서 반 이름과 순환 시작일을 등록해주세요.");return}
  const payload={
    room_id:state.room.id,
    event_date:$("eventDate").value,
    start_time:$("eventTime").value,
    title:$("eventTitle").value.trim(),
    memo:$("eventMemo").value.trim(),
    teacher_id:$("eventTeacher").value||null,
    completed:false
  };
  if(!payload.event_date||!payload.title){alert("날짜와 업무명은 꼭 입력해주세요.");return}
  if(!sb){
    if(state.editingId) Object.assign(state.events.find(e=>e.id===state.editingId),payload);
    else state.events.push({id:crypto.randomUUID(),...payload});
    saveFallback(); closeModal("eventModal"); renderCalendar(); return;
  }
  try{
    let error;
    if(state.editingId){
      ({error}=await sb.from("schedule_events").update(payload).eq("id",state.editingId));
    }else{
      ({error}=await sb.from("schedule_events").insert(payload));
    }
    if(error) throw error;
    closeModal("eventModal"); await loadData();
  }catch(e){console.error(e);alert("일정 저장에 실패했습니다. schedule_events의 컬럼 이름을 확인해주세요.");}
}

async function toggleDone(id,done){
  const e=state.events.find(x=>x.id===id); if(!e)return;
  if(!sb){e.completed=done;saveFallback();renderCalendar();return}
  const {error}=await sb.from("schedule_events").update({completed:done}).eq("id",id);
  if(error){alert("완료 상태 저장에 실패했습니다.");return}
  e.completed=done; renderCalendar();
}

async function deleteEvent(id){
  if(!confirm("이 일정을 삭제할까요?"))return;
  if(!sb){state.events=state.events.filter(e=>e.id!==id);saveFallback();renderCalendar();return}
  const {error}=await sb.from("schedule_events").delete().eq("id",id);
  if(error){alert("삭제에 실패했습니다.");return}
  state.events=state.events.filter(e=>e.id!==id);renderCalendar();
}

function addTeacher(){
  const idx=state.teachers.length;
  state.teachers.push({id:crypto.randomUUID(),room_id:state.room?.id||null,name:"",sort_order:idx,color:palette[idx%palette.length]});
  renderAll();
}

function editTeacher(i,key,val){state.teachers[i][key]=val;renderLegend();renderCycle();renderCalendar()}
function removeTeacher(i){if(confirm("이 교사를 삭제할까요?")){state.teachers.splice(i,1);state.teachers.forEach((t,j)=>t.sort_order=j);renderAll()}}

async function saveTeachers(){
  if(!state.room){alert("먼저 반 설정을 저장해주세요.");return}
  if(!sb){state.teachers.forEach((t,i)=>{t.room_id=state.room.id;t.sort_order=i});saveFallback();renderAll();alert("로컬 미리보기에서 저장했습니다.");return}
  try{
    for(const t of state.teachers){
      const payload={room_id:state.room.id,name:t.name.trim()||"이름 미입력",sort_order:t.sort_order,color:t.color};
      if(typeof t.id==="string" && t.id.length>10 && !t.id.includes("-")){}
      const {error}=await sb.from("teachers").upsert({...payload,id:t.id},{onConflict:"id"});
      if(error) throw error;
    }
    await loadData(); alert("교사 순서와 색상을 저장했습니다.");
  }catch(e){console.error(e);alert("교사 저장에 실패했습니다. teachers 테이블의 컬럼을 확인해주세요.");}
}

function openSettings(){
  $("roomName").value=state.room?.class_name||"";
  $("cycleStart").value=state.room?.cycle_start||iso(new Date());
  openModal("settingsModal");
}

async function saveRoom(){
  const name=$("roomName").value.trim();
  const cycle=$("cycleStart").value;
  if(!name||!cycle){alert("반 이름과 순환 시작일을 입력해주세요.");return}
  if(!sb){
    state.room=state.room||{id:crypto.randomUUID()};
    state.room.class_name=name;state.room.cycle_start=cycle;
    state.teachers.forEach(t=>t.room_id=state.room.id);
    saveFallback();closeModal("settingsModal");renderAll();return;
  }
  try{
    if(state.room){
      const {data,error}=await sb.from("rooms").update({class_name:name,cycle_start:cycle}).eq("id",state.room.id).select().single();
      if(error)throw error; state.room=data;
    }else{
      const {data,error}=await sb.from("rooms").insert({room_key:"main",class_name:name,cycle_start:cycle}).select().single();
      if(error)throw error; state.room=data;
    }
    state.teachers.forEach(t=>t.room_id=state.room.id);
    closeModal("settingsModal");renderAll();
  }catch(e){console.error(e);alert("반 설정 저장에 실패했습니다.");}
}

function openOcr(){openModal("ocrModal");$("imageInput").value="";$("ocrProgress").textContent="이미지를 선택해주세요.";$("ocrText").style.display="none";$("ocrEntries").innerHTML=""}

$("imageInput").addEventListener("change",async(e)=>{
  const file=e.target.files?.[0]; if(!file)return;
  $("ocrProgress").textContent="이미지를 읽는 중입니다. 사진에 따라 조금 걸릴 수 있어요.";
  try{
    const result=await Tesseract.recognize(file,"kor+eng",{
      logger:m=>{
        if(m.status==="recognizing text") $("ocrProgress").textContent=`글자 인식 중… ${Math.round((m.progress||0)*100)}%`;
      }
    });
    const text=result.data.text||"";
    $("ocrProgress").textContent="인식 완료. 아래 내용을 확인해주세요.";
    $("ocrText").style.display="block"; $("ocrText").textContent=text||"인식된 글자가 없습니다.";
    buildOcrEntries(text);
  }catch(err){
    console.error(err); $("ocrProgress").textContent="인식에 실패했습니다.";
  }
});

function buildOcrEntries(text){
  const lines=text.split(/\n+/).map(x=>x.trim()).filter(Boolean);
  const box=$("ocrEntries");box.innerHTML="";
  if(!lines.length)return;
  const info=document.createElement("div");
  info.className="sub";
  info.textContent="인식된 내용 중 우리 반 일정으로 등록할 항목을 골라 날짜·시간·담당자를 지정해주세요.";
  box.appendChild(info);
  lines.slice(0,80).forEach((line,idx)=>{
    const row=document.createElement("div");
    row.style.cssText="border:1px solid #eee;border-radius:10px;padding:8px;margin-top:7px";
    row.innerHTML=`
      <label style="margin:0"><input type="checkbox" id="ocr_${idx}" style="width:auto"> 우리 반 일정으로 추가</label>
      <input id="ocr_date_${idx}" type="date" style="margin-top:5px">
      <input id="ocr_time_${idx}" type="time" value="09:00" style="margin-top:5px">
      <input id="ocr_title_${idx}" value="${escapeHtml(line)}" style="margin-top:5px">
      <select id="ocr_teacher_${idx}" style="margin-top:5px"><option value="">공동업무</option>${state.teachers.map(t=>`<option value="${t.id}">${escapeHtml(t.name)}</option>`).join("")}</select>`;
    box.appendChild(row);
  });
  const btn=document.createElement("button");
  btn.className="btn primary";btn.style.marginTop="10px";btn.textContent="선택한 일정 등록";
  btn.onclick=async()=>{
    const rows=[];
    lines.slice(0,80).forEach((_,idx)=>{
      if($(`ocr_${idx}`)?.checked && $(`ocr_date_${idx}`).value && $(`ocr_title_${idx}`).value.trim()){
        rows.push({
          room_id:state.room?.id,event_date:$(`ocr_date_${idx}`).value,start_time:$(`ocr_time_${idx}`).value,
          title:$(`ocr_title_${idx}`).value.trim(),memo:"이미지에서 인식된 일정",teacher_id:$(`ocr_teacher_${idx}`).value||null,completed:false
        });
      }
    });
    if(!state.room){alert("먼저 반 설정을 저장해주세요.");return}
    if(!sb){
      rows.forEach(x=>state.events.push({id:crypto.randomUUID(),...x}));saveFallback();renderCalendar();alert(`${rows.length}개 일정을 등록했습니다.`);return;
    }
    if(rows.length){
      const {error}=await sb.from("schedule_events").insert(rows);
      if(error){alert("이미지 일정 저장에 실패했습니다.");return}
      await loadData();alert(`${rows.length}개 일정을 등록했습니다.`);
    }
  };
  box.appendChild(btn);
}

function changeMonth(delta){state.month=new Date(state.month.getFullYear(),state.month.getMonth()+delta,1);renderCalendar()}
function goToday(){state.month=new Date();renderCalendar()}
function hexToRgba(hex,a){
  const h=hex.replace("#","");
  const n=parseInt(h.length===3?h.split("").map(x=>x+x).join(""):h,16);
  return `rgba(${n>>16},${(n>>8)&255},${n&255},${a})`;
}
function escapeHtml(s){
  return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));
}

/* 미완료 일정은 '다음날로 이동' 기능을 위한 기본 처리.
   실제 이동은 사용자가 페이지를 열 때 1회 수행합니다. */
async function moveOverdue(){
  const today=iso(new Date());
  const overdue=state.events.filter(e=>!e.completed && e.event_date<today);
  if(!overdue.length)return;
  for(const e of overdue){
    const d=new Date(e.event_date+"T00:00:00"); d.setDate(d.getDate()+1);
    while(iso(d)<today) d.setDate(d.getDate()+1);
    e.event_date=iso(d);
    if(sb) await sb.from("schedule_events").update({event_date:e.event_date}).eq("id",e.id);
  }
  if(!sb)saveFallback();
}

(async function init(){
  await loadData();
  if(state.room) await moveOverdue();
  renderAll();
})();
</script>
